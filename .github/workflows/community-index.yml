name: Community index
# Writes community-index.json and the videos' stills in community-media/ for the
# library's firmware cards. Commits only when something changed.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/community-index.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit when it changed
        run: |
          if [ -z "$(git status --porcelain -- community-index.json community-media)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-index.json community-media
          git commit -m "Changed community-index.json: the daily snapshot of the community directory"
          git push
